    <!-- The first frame, before any script: the brand colour with the heart in place. Same colours and mark size as the launch screen (src/components/launch.css),
         the manifest and the native splash, so the hand-over from the phone's own splash is seamless. LaunchScreen.jsx removes it once it has taken over. -->
    <style>
      html.hw-launching, html.hw-launching body { background: #164E63; }
      #hw-launch { position: fixed; inset: 0; z-index: 2147483000; display: grid; place-items: center; background: linear-gradient(170deg, #164E63 0%, #0A7C99 100%); }
      #hw-launch svg { width: min(30vmin, 168px); height: min(30vmin, 168px); display: block; }
    </style>
    <script>document.documentElement.classList.add("hw-launching");</script>
